<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Meii-Meii 💖</title>

<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    background: radial-gradient(circle at top, #1a001a, #0d0d0d);
    color: #ff69b4;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: 'Poppins', sans-serif;
    text-align: center;
    overflow: hidden;
    opacity: 0;
    animation: fadePage 2s ease forwards;
}

@keyframes fadePage {
    to { opacity: 1; }
}

.container {
    text-align: center;
}

h1 {
    font-family: 'Dancing Script', cursive;
    font-size: 40px;
}

button {
    padding: 15px 25px;
    background: linear-gradient(45deg, #ff69b4, #ff1493);
    border: none;
    border-radius: 20px;
    color: white;
    cursor: pointer;
    box-shadow: 0 0 15px #ff69b4;
    transition: 0.3s;
}

/* efek hover biar hidup */
button:hover {
    transform: scale(1.05);
    box-shadow: 0 0 25px #ff69b4;
}
</style>
</head>

<body>

<div class="container">
    <h1>Hai, Meii-Meii 💖</h1>
    <p>Aku ada sesuatu buat kamu...</p>
    <button onclick="masuk()">Tap di sini ya ✨</button>
</div>

<script>
function masuk() {
    window.location.href = "main.html";
}
</script>
<script>
const openDate = new Date("May 15, 2030 00:00:00").getTime();
const now = new Date().getTime();

if (now < openDate) {

    document.body.innerHTML = `
    <div style="
        margin:0;
        height:100vh;
        background: radial-gradient(circle at top, #1a001a, #000);
        display:flex;
        justify-content:center;
        align-items:center;
        flex-direction:column;
        color:#ffb6c1;
        font-family:Poppins;
        text-align:center;
        overflow:hidden;
    ">

        <h1 style="
            font-size:50px;
            margin-bottom:10px;
        ">
            belum waktunya 💖
        </h1>

        <p style="
            opacity:0.8;
            font-size:18px;
        ">
            buka nanti yaa 😊
        </p>

    </div>
    `;
}
</script>
</body>
</html>
