<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday 💖</title>

<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    background: radial-gradient(circle at top, #1a001a, #0d0d0d);
    color: #ffb6c1;
    font-family: 'Poppins', sans-serif;
    text-align: center;
    overflow-x: hidden;
}

.container {
    margin: 40px auto;
    padding: 25px;
    width: 90%;
    max-width: 400px;
    background: rgba(255, 105, 180, 0.08);
    border-radius: 25px;
    backdrop-filter: blur(10px);
    box-shadow: 0 0 30px rgba(255, 105, 180, 0.2);
}

h1 {
    font-family: 'Dancing Script', cursive;
    font-size: 40px;
}

img {
    width: 220px;
    border-radius: 20px;
    margin: 20px 0;
    opacity: 0;
    transform: translateY(20px);
    animation: fadeIn 2s ease forwards, glow 2s infinite alternate, float 4s ease-in-out infinite;
}

@keyframes fadeIn {
    to { opacity: 1; transform: translateY(0); }
}

@keyframes glow {
    from { box-shadow: 0 0 15px #ff69b4; }
    to { box-shadow: 0 0 35px #ff1493; }
}

@keyframes float {
    0% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
    100% { transform: translateY(0); }
}

button {
    padding: 12px 20px;
    background: linear-gradient(45deg, #ff69b4, #ff1493);
    border: none;
    border-radius: 20px;
    color: white;
    cursor: pointer;
    margin: 10px;
    box-shadow: 0 0 15px #ff69b4;
}

#nextBtn {
    opacity: 0;
    transform: translateY(20px);
    transition: all 0.8s ease;
}

.showBtn {
    opacity: 1 !important;
    transform: translateY(0) !important;
    animation: pulse 1.5s infinite;
}

@keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.08); }
    100% { transform: scale(1); }
}

.hidden { display: none; }

/* 🔥 FIX SPACING */
#typing {
    white-space: pre-wrap;
    line-height: 2.2;
    letter-spacing: 0.5px;
    max-width: 320px;
    margin: 20px auto;
}

/* CURSOR */
#typing::after {
    content: "|";
    animation: blink 1s infinite;
}

@keyframes blink {
    0%,100% { opacity: 1; }
    50% { opacity: 0; }
}

/* HEART */
.hearts {
    position: fixed;
    width: 100%;
    height: 100%;
    pointer-events: none;
}

.heart {
    position: absolute;
    color: #ff69b4;
    animation: fall linear infinite;
}

@keyframes fall {
    0% { transform: translateY(-10%); }
    100% { transform: translateY(110vh); }
}
</style>
</head>

<body onclick="startMusic()">

<div class="hearts"></div>

<div class="container">
<h1>Happy Birthday, OCHAAA 💖</h1>

<img src="foto.jpg">

<p id="countdown"></p>

<!-- <button onclick="playMusic()">Play Music 🎵</button> -->
<button onclick="showMessage()">Klik ini ya ✨</button>
<button id="nextBtn" onclick="nextPage()" style="display:none;">jangan di klik meiiii</button>

<div id="pesan" class="hidden">
<div id="typing"></div>
</div>
</div>

<audio id="musik" loop>
<source src="musik.mp3" type="audio/mp3">
</audio>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script>
// MUSIC
const audio = document.getElementById("musik");

// ambil posisi terakhir
const savedTime = localStorage.getItem("musicTime");
if (savedTime) {
    audio.currentTime = savedTime;
}

// ⛔ ini penting: play HARUS dari interaksi user
function startMusic() {
    audio.play();
}

// simpan posisi tiap detik
setInterval(() => {
    localStorage.setItem("musicTime", audio.currentTime);
}, 1000);

// NEXT PAGE
function nextPage() {
    window.location.href = "memory.html";
}

// COUNTDOWN
const targetDate = new Date("May 15, 2026 00:00:00").getTime();
const countdown = document.getElementById("countdown");

setInterval(() => {
    const now = new Date().getTime();
    const distance = targetDate - now;

    const hari = Math.floor(distance / (1000*60*60*24));
    const jam = Math.floor((distance % (1000*60*60*24)) / (1000*60*60));
    const menit = Math.floor((distance % (1000*60*60)) / (1000*60));
    const detik = Math.floor((distance % (1000*60)) / 1000);

    countdown.innerHTML = `${hari} hari ${jam} jam ${menit} menit ${detik} detik`;
}, 1000);

// TEXT
const text = `Selamat ulang tahun yaa 🎂💖

Semoga semua hal baik selalu datang ke kamu,
dan hari-hari kamu selalu penuh senyuman 😊

Aku cuma mau bilang...

terima kasih ya, kamu udah jadi orang yang
selalu seru buat diajak ngobrol 😄

Semoga di umur baru ini,

Semua yang kamu harapkan terwujudkan,
kamu makin bahagia, makin sehat,
dan tetap jadi kamu yang sekarang sih jauh lebih penting 💖`;

let index = 0;

// 🔥 TYPING + JEDA PARAGRAF
function typeText() {
    if (index < text.length) {
        const char = text.charAt(index);
        document.getElementById("typing").innerHTML += char;
        index++;

        if (char === "\n" && text.charAt(index) === "\n") {
            setTimeout(typeText, 700);
        } else {
            setTimeout(typeText, Math.random() * 30 + 35);
        }

    } else {
        let btn = document.getElementById("nextBtn");
        btn.style.display = "inline-block";
        setTimeout(() => btn.classList.add("showBtn"), 100);
    }
}

// SHOW MESSAGE
function showMessage() {
    document.getElementById("pesan").classList.remove("hidden");

    document.getElementById("typing").innerHTML = "";
    let btn = document.getElementById("nextBtn");
    btn.style.display = "none";
    btn.classList.remove("showBtn");

    index = 0;
    typeText();

    let duration = 4 * 1000;
    let end = Date.now() + duration;

    (function frame() {
        confetti({
            particleCount: 12,
            spread: 160,
            startVelocity: 50,
            origin: { x: Math.random(), y: Math.random() - 0.2 }
        });

        if (Date.now() < end) {
            requestAnimationFrame(frame);
        }
    })();
}

// HEART
function createHeart() {
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML = "💖";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.animationDuration = (Math.random()*3+2)+"s";
    document.querySelector(".hearts").appendChild(heart);
    setTimeout(()=>heart.remove(),5000);
}
setInterval(createHeart,300);

document.addEventListener("click", () => {
    document.getElementById("musik").play();
}, { once: true });
</script>

</body>
</html>
