<!-- <!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    background: radial-gradient(circle at top, #1a001a, #0d0d0d);
    font-family: 'Poppins', sans-serif;
    color: #ffb6c1;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    text-align: center;
}

/* CARD */
.box {
    padding: 25px;
    background: rgba(255, 105, 180, 0.08);
    border-radius: 25px;
    box-shadow: 0 0 30px rgba(255, 105, 180, 0.2);
}

/* TITLE */
h2 {
    margin-bottom: 15px;
}

/* CALENDAR */
.calendar {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 8px;
    margin: 15px 0;
}

.day {
    padding: 10px;
    border-radius: 10px;
    cursor: pointer;
    background: rgba(255,255,255,0.05);
    transition: 0.3s;
}

.day:hover {
    background: #ff69b4;
    color: white;
    transform: scale(1.1);
}

/* SELECTED */
.selected {
    background: #ff1493 !important;
    color: white;
    box-shadow: 0 0 15px #ff1493;
}

/* BUTTON */
button {
    margin-top: 15px;
    padding: 10px 18px;
    border: none;
    border-radius: 20px;
    background: linear-gradient(45deg,#ff69b4,#ff1493);
    color: white;
    cursor: pointer;
    box-shadow: 0 0 10px #ff69b4;
}

/* TEXT */
#result {
    margin-top: 10px;
    opacity: 0;
    transition: 0.5s;
}

#noBtn {
    position: relative;
    margin-top: 10px;
    padding: 10px 18px;
    border: none;
    border-radius: 20px;
    background: #444;
    color: white;
    cursor: pointer;
    transition: 0.2s;
}
</style>
</head>

<body onclick="startMusic()">
    
<div class="box">
    <h2>Pilih tanggal yang kamu mau 💖</h2>

    <div class="calendar" id="calendar"></div>

    <button id="inviteBtn" onclick="invite()">Ajak Dinner 🍽️</button>
    <button id="noBtn">gak dulu 😅</button>

    <p id="result"></p>
</div>

<audio id="musik" loop>
<source src="musik.mp3" type="audio/mp3">
</audio>

<script>
const calendar = document.getElementById("calendar");
const inviteBtn = document.getElementById("inviteBtn");
const result = document.getElementById("result");

let selectedDay = null;

// generate tanggal 1-31
for (let i = 1; i <= 31; i++) {
    const day = document.createElement("div");
    day.classList.add("day");
    day.innerText = i;

    day.onclick = () => {
        document.querySelectorAll(".day").forEach(d => d.classList.remove("selected"));
        day.classList.add("selected");
        selectedDay = i;

        inviteBtn.style.display = "inline-block";
    };

    calendar.appendChild(day);
}

// klik ajak dinner
function invite() {
    result.innerHTML = `berarti kita dinner tanggal ${selectedDay} ya... aku tunggu 😄💖`;
    result.style.opacity = "1";
}

const noBtn = document.getElementById("noBtn");

// kabur pas dideketin
noBtn.addEventListener("mouseenter", () => {
    const x = Math.random() * 200 - 100;
    const y = Math.random() * 200 - 100;

    noBtn.style.transform = `translate(${x}px, ${y}px)`;
});

// kalau kepencet (jarang terjadi 😏)
noBtn.addEventListener("click", () => {
    document.getElementById("result").innerHTML = "yaaahhhhh";
    document.getElementById("result").style.opacity = "1";
});

const audio = document.getElementById("musik");

// ambil posisi terakhir
const savedTime = localStorage.getItem("musicTime");
if (savedTime) {
    audio.currentTime = savedTime;
}

// ⛔ ini penting: play HARUS dari interaksi user
function startMusic() {
    audio.play();
}

// simpan posisi tiap detik
setInterval(() => {
    localStorage.setItem("musicTime", audio.currentTime);
}, 1000);
</script>

</body>
</html> -->
